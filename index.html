<style>
  :root{
    --dark:#28362c;
    --dark2:#1f2a22;
    --cream:#f2ead9;
    --card-light:#f8f2e5;
    --card-line:rgba(36,42,31,0.14);
    --gold:#c99a3d;
    --gold-dark:#a97f2e;
    --ink:#242a1f;
    --muted:#726f60;
    --danger:#a23e2f;
    --success:#3f7d4a;
    --white:#fffdf8;
    --radius:16px;
    --shadow:0 12px 28px rgba(31,42,34,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;}
  h1,h2,h3{font-family:'Playfair Display',serif;margin:0;color:var(--ink);}
  p{margin:0;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  input,textarea{font-family:'Inter',sans-serif;}
  #app{min-height:100vh;display:flex;flex-direction:column;}

  .topbar{background:var(--dark);color:var(--card-light);display:flex;align-items:center;gap:14px;padding:14px 18px;position:sticky;top:0;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,0.15);}
  .hamburger{background:transparent;border:1px solid rgba(244,239,225,0.35);border-radius:10px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--card-light);transition:background .15s;}
  .hamburger:hover{background:rgba(244,239,225,0.12);}
  .topbar-titles{display:flex;flex-direction:column;line-height:1.15;}
  .topbar-titles .t1{font-family:'Playfair Display',serif;font-weight:700;font-size:19px;}
  .topbar-titles .t2{font-size:12px;color:#d8cdb2;margin-top:2px;}

  .overlay{position:fixed;inset:0;background:rgba(20,25,18,0.45);z-index:30;}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:270px;max-width:82vw;background:var(--white);z-index:31;box-shadow:6px 0 24px rgba(0,0,0,0.2);display:flex;flex-direction:column;padding:20px 0;animation:slideIn .18s ease-out;}
  @keyframes slideIn{from{transform:translateX(-100%);}to{transform:translateX(0);}}
  .drawer-head{padding:0 20px 16px 20px;border-bottom:1px solid var(--card-line);margin-bottom:8px;}
  .drawer-head .sch{font-size:13px;color:var(--muted);margin-top:4px;}
  .drawer-item{display:flex;align-items:center;gap:10px;padding:13px 20px;color:var(--ink);font-size:15px;font-weight:500;border:none;background:transparent;width:100%;text-align:left;}
  .drawer-item:hover{background:var(--cream);}
  .drawer-item.danger{color:var(--danger);}
  .drawer-sep{height:1px;background:var(--card-line);margin:8px 0;}

  .page{flex:1;width:100%;max-width:520px;margin:0 auto;padding:28px 20px 60px 20px;}
  .page.wide{max-width:720px;}

  .home-logo-wrap{display:flex;justify-content:center;margin-bottom:18px;}
  .home-logo{width:112px;height:112px;border-radius:50%;object-fit:cover;box-shadow:var(--shadow);border:3px solid var(--white);}
  .home-title{text-align:center;font-size:26px;font-weight:700;line-height:1.25;margin-bottom:6px;}
  .home-sub{text-align:center;color:var(--muted);font-size:14.5px;margin-bottom:30px;}

  .option-card{border-radius:var(--radius);padding:22px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--card-line);display:flex;flex-direction:column;gap:10px;transition:transform .12s;}
  .option-card:hover{transform:translateY(-2px);}
  .option-card.light{background:var(--card-light);color:var(--ink);}
  .option-card.dark{background:var(--dark);color:var(--card-light);}
 .option-card.dark h3{color:var(--card-light);}
  .option-card .icon{width:40px;height:40px;color:var(--gold);}
  .option-card.dark .icon{color:var(--gold);}
  .option-card h3{font-size:19px;font-weight:700;}
  .option-card .desc{font-size:14px;color:var(--muted);}
  .option-card.dark .desc{color:#cfc5ac;}

  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;background:none;border:none;padding:0;margin-bottom:18px;font-weight:500;}
  .back-link:hover{color:var(--ink);}

  .panel-card{background:var(--white);border:1px solid var(--card-line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px;color:var(--ink);}
  .field input, .field textarea{width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--card-line);background:var(--cream);font-size:15px;color:var(--ink);outline:none;transition:border-color .12s;}
  .field input:focus, .field textarea:focus{border-color:var(--gold);}
  .field textarea{resize:vertical;min-height:70px;}
  .hint{font-size:12.5px;color:var(--muted);margin-top:5px;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:11px;border:none;font-size:15px;font-weight:600;width:100%;}
  .btn-gold{background:var(--gold);color:var(--dark2);}
  .btn-gold:hover{background:var(--gold-dark);}
  .btn-dark{background:var(--dark);color:var(--card-light);}
  .btn-dark:hover{background:var(--dark2);}
  .btn-outline{background:transparent;border:1.5px solid var(--card-line);color:var(--ink);}
  .btn-outline:hover{border-color:var(--gold);}
  .btn-danger{background:transparent;border:1.5px solid rgba(162,62,47,0.4);color:var(--danger);}
  .btn-danger:hover{background:rgba(162,62,47,0.08);}
  .btn-sm{width:auto;padding:8px 14px;font-size:13.5px;border-radius:9px;}
  .btn-link{background:none;border:none;color:var(--gold-dark);font-size:14px;font-weight:600;padding:4px;width:auto;}

  .row{display:flex;gap:10px;}
  .row > *{flex:1;}

  .msg{padding:11px 14px;border-radius:10px;font-size:13.5px;margin-bottom:16px;font-weight:500;}
  .msg.error{background:rgba(162,62,47,0.1);color:var(--danger);}
  .msg.success{background:rgba(63,125,74,0.12);color:var(--success);}

  .teacher-list{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;}
  .teacher-list-item{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-radius:11px;background:var(--card-light);border:1px solid var(--card-line);font-weight:600;font-size:15px;}
  .teacher-list-item:hover{border-color:var(--gold);}
  .teacher-list-item .arrow{color:var(--gold-dark);font-size:18px;}
  .empty-note{text-align:center;color:var(--muted);font-size:14.5px;padding:30px 10px;}

  .section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 14px 0;}
  .section-title h2{font-size:19px;}

  .day-card{background:var(--white);border:1px solid var(--card-line);border-radius:14px;padding:16px 18px;margin-bottom:12px;box-shadow:0 4px 12px rgba(31,42,34,0.06);}
  .day-card .dc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}
  .day-card .dc-date{font-weight:700;font-size:15px;}
  .day-card .dc-price{font-weight:700;color:var(--gold-dark);font-size:15.5px;white-space:nowrap;}
  .day-card .dc-items{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:12px;}
  .toggle-btn{width:100%;padding:11px;border-radius:10px;border:1.5px solid var(--card-line);background:var(--cream);font-weight:600;font-size:14.5px;color:var(--ink);}
  .toggle-btn.active{background:var(--success);border-color:var(--success);color:#fff;}
  .dc-admin-actions{display:flex;gap:8px;margin-top:10px;}

  .selection-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--white);border:1px solid var(--card-line);border-radius:12px;margin-bottom:10px;}
  .selection-row .count{font-weight:700;color:var(--gold-dark);}
  .selection-names{padding:10px 16px 4px 16px;font-size:13.5px;color:var(--muted);}
  .selection-names span{display:inline-block;background:var(--cream);padding:4px 10px;border-radius:8px;margin:0 6px 6px 0;}

  .modal-overlay{position:fixed;inset:0;background:rgba(20,25,18,0.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;}
  @media(min-width:560px){.modal-overlay{align-items:center;}}
  .modal-box{background:var(--white);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:24px 22px 28px 22px;max-height:88vh;overflow-y:auto;box-shadow:0 -10px 30px rgba(0,0,0,0.2);}
  @media(min-width:560px){.modal-box{border-radius:18px;}}
  .modal-box h3{font-size:19px;margin-bottom:16px;}

  .footer-note{text-align:center;color:var(--muted);font-size:12.5px;margin-top:30px;}

  .admin-teacher-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;background:var(--white);border:1px solid var(--card-line);border-radius:12px;margin-bottom:10px;}
  .admin-teacher-row .name{font-weight:600;font-size:15px;}
  .admin-teacher-row .actions{display:flex;gap:6px;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--card-line);border-radius:8px;}
</style>
</head>

const MONTHS_TR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const DAYS_TR = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];

/* ---------- state ---------- */
let state = {
  view: 'home',
  history: [],
  drawerOpen: false,
  session: { role: null, teacherId: null, teacherName: null },
  teacherPickId: null,
  forgotStep: null,
  error: null,
  info: null,
  modal: null,
  expanded: {},
  historyDate: '',
  loading: true,
};

/* ---------- helpers ---------- */
function uid(){ return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function formatDateTR(dateStr){
  if(!dateStr) return '';
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return `${d} ${MONTHS_TR[m-1]} ${y} ${DAYS_TR[dt.getDay()]}`;
}
function formatPrice(p){
  const n = Number(p)||0;
  return '₺' + n.toLocaleString('tr-TR', {minimumFractionDigits: n % 1 === 0 ? 0 : 2});
}
function el(tag, opts={}, children=[]){
  const e = document.createElement(tag);
  if(opts.class) e.className = opts.class;
  if(opts.text !== undefined) e.textContent = opts.text;
  if(opts.html !== undefined) e.innerHTML = opts.html;
  if(opts.attrs) for(const k in opts.attrs) e.setAttribute(k, opts.attrs[k]);
  if(opts.style) Object.assign(e.style, opts.style);
  if(opts.on) for(const evt in opts.on) e.addEventListener(evt, opts.on[evt]);
  (children||[]).forEach(c => { if(c) e.appendChild(c); });
  return e;
}
function clearMsgs(){ state.error = null; state.info = null; }
function navSnapshot(){
  return {
    view: state.view,
    history: state.history.slice(),
    session: { ...state.session },
    teacherPickId: state.teacherPickId,
    forgotStep: state.forgotStep,
    historyDate: state.historyDate
  };
}
function pushNav(){ try{ history.pushState(navSnapshot(), '', ''); }catch(e){} }
function replaceNav(){ try{ history.replaceState(navSnapshot(), '', ''); }catch(e){} }

function goto(view, opts={}){
  clearMsgs();
  if(opts.resetHistory){
    state.history = [];
  } else if(state.view !== view){
    state.history.push(state.view);
  }
  state.view = view;
  state.drawerOpen = false;
  if(opts.resetHistory){ replaceNav(); } else { pushNav(); }
  render(true);
}
function goBack(){
  // Telefonun kendi geri tuşuyla aynı fonksiyonu paylaşsın diye
  // gerçek tarayıcı geçmişinden bir adım geri gidiyoruz; asıl state
  // güncellemesi aşağıdaki popstate dinleyicisinde yapılır.
  if(state.history.length > 0){ history.back(); }
}
window.addEventListener('popstate', (e)=>{
  clearMsgs();
  const s = e.state;
  if(s){
    state.view = s.view || 'home';
    state.history = s.history || [];
    state.session = s.session || { role:null, teacherId:null, teacherName:null };
    state.teacherPickId = s.teacherPickId || null;
    state.forgotStep = s.forgotStep || null;
    state.historyDate = s.historyDate || '';
  } else {
    state.view = 'home';
    state.history = [];
  }
  state.drawerOpen = false;
  render(true);
});
function todayStr(){
  const d = new Date();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${d.getFullYear()}-${m}-${day}`;
}

/* ---------- storage (Firebase Firestore) ---------- */
// Tüm veriler "kantin_okul" koleksiyonundaki tek tek dokümanlarda tutulur:
// teachers, menu-week, selections, config
const COLLECTION_NAME = 'kantin_okul';

async function fsGet(key){
  try{
    const snap = await db.collection(COLLECTION_NAME).doc(key).get();
    if(snap.exists) return snap.data().value;
    return null;
  }catch(e){ console.error('Firestore okuma hatası:', e); return null; }
}
async function fsSet(key, value){
  try{
    await db.collection(COLLECTION_NAME).doc(key).set({ value });
    return true;
  }catch(e){
    console.error('Firestore yazma hatası:', e);
    alert('Kaydedilirken bir hata oluştu. İnternet bağlantınızı kontrol edin.');
    return false;
  }
}

async function getTeachers(){
  const v = await fsGet('teachers');
  return v ? JSON.parse(v) : [];
}
async function setTeachers(arr){
  return await fsSet('teachers', JSON.stringify(arr));
}
// Bir günün seçeneklerini normalize eder: eski formatta (tek "items"+"price")
// kaydedilmiş günleri yeni "options" dizisine çevirir. Geriye dönük uyumluluk için.
function normalizeDay(day){
  if(!day.options || !Array.isArray(day.options) || day.options.length === 0){
    day.options = [{ id: uid(), name: day.items || 'Menü', price: Number(day.price)||0 }];
  }
  delete day.items;
  delete day.price;
  return day;
}
async function getMenu(){
  const v = await fsGet('menu-week');
  let arr;
  if(v) arr = JSON.parse(v);
  else { arr = seedMenu(); await setMenu(arr); return arr; }
  let changed = false;
  arr.forEach(day=>{
    if(!day.options || !Array.isArray(day.options) || day.options.length === 0){
      normalizeDay(day);
      changed = true;
    }
  });
  if(changed) await setMenu(arr);
  return arr;
}
async function setMenu(arr){
  arr.sort((a,b)=> a.date.localeCompare(b.date));
  return await fsSet('menu-week', JSON.stringify(arr));
}
function seedMenu(){
  return [
    {id: uid(), date:'2026-09-15', options:[{id:uid(), name:'Mercimek Çorbası + Ekmek Arası Tavuk Döner', price:185}]},
    {id: uid(), date:'2026-09-16', options:[{id:uid(), name:'Ezogelin Çorbası + Pilav Üstü Tavuk', price:185}]},
    {id: uid(), date:'2026-09-17', options:[{id:uid(), name:'Tavuk Suyu Şehriye Çorbası + Mantı', price:185}]},
    {id: uid(), date:'2026-09-18', options:[{id:uid(), name:'Tarhana Çorbası + Kuru Fasulye', price:185}]},
  ];
}
// Bir seçimi normalize eder: eski formatta (true veya tekil optionId) kaydedilmiş
// seçimleri yeni { optionIds: [], paidByTeacher, paidConfirmed, paymentRejected } formatına çevirir.
function normalizeSelection(sel, fallbackOptionId){
  if(sel === true){
    return { optionIds: fallbackOptionId ? [fallbackOptionId] : [], paidByTeacher:false, paidConfirmed:false, paymentRejected:false };
  }
  if(sel && typeof sel === 'object'){
    let optionIds;
    if(Array.isArray(sel.optionIds)) optionIds = sel.optionIds.slice();
    else if(sel.optionId) optionIds = [sel.optionId];
    else optionIds = fallbackOptionId ? [fallbackOptionId] : [];
    return {
      optionIds,
      paidByTeacher: !!sel.paidByTeacher,
      paidConfirmed: !!sel.paidConfirmed,
      paymentRejected: !!sel.paymentRejected
    };
  }
  return null;
}
async function getSelections(){
  const v = await fsGet('selections');
  return v ? JSON.parse(v) : {};
}
async function setSelections(obj){
  return await fsSet('selections', JSON.stringify(obj));
}
async function getConfig(){
  const v = await fsGet('config');
  let cfg;
  if(v) cfg = JSON.parse(v);
  else cfg = { canteenPassword: DEFAULT_PASSWORD };
  let changed = !v;
  if(typeof cfg.ordersOpen !== 'boolean'){ cfg.ordersOpen = true; changed = true; }
  if(changed) await fsSet('config', JSON.stringify(cfg));
  return cfg;
}
async function setConfig(obj){
  return await fsSet('config', JSON.stringify(obj));
}

    return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>`;
  }
  return '';
}

    listWrap.innerHTML = '';
    const sorted = [...teachers].sort((a,b)=>a.name.localeCompare(b.name,'tr'));

      ]));
    });
  }
  renderList('');
  searchInput.addEventListener('input', ()=> renderList(searchInput.value));
  return c;

/* ---------- Öğretmen ödeme özeti ---------- */
function selTotal(day, sel){
  return (sel.optionIds || []).reduce((sum, id)=>{
    const opt = (day.options||[]).find(o=>o.id===id);
    return sum + (opt ? Number(opt.price)||0 : 0);
  }, 0);
}

function buildPaymentSummary(menu, selectionsRaw, teacherId){
  let unpaid = [], pending = [], confirmedTotal = 0;
  menu.forEach(day=>{
    const raw = selectionsRaw[day.id] && selectionsRaw[day.id][teacherId];
    const sel = normalizeSelection(raw, day.options && day.options[0] && day.options[0].id);
    if(!sel || !sel.optionIds || sel.optionIds.length === 0) return;
    const total = selTotal(day, sel);
    const names = sel.optionIds
      .map(id => ((day.options||[]).find(o=>o.id===id)||{}).name)
      .filter(Boolean).join(', ');
    const item = { day, total, names, rejected: sel.paymentRejected };
    if(sel.paidConfirmed) confirmedTotal += total;
    else if(sel.paidByTeacher) pending.push(item);
    else unpaid.push(item);
  });

  const unpaidTotal = unpaid.reduce((s,x)=>s+x.total, 0);
  const pendingTotal = pending.reduce((s,x)=>s+x.total, 0);

  const card = el('div', {class:'panel-card', style:{marginBottom:'22px'}});
  card.appendChild(el('h2', {text:'Ödeme özeti', style:{fontSize:'19px', marginBottom:'14px'}}));

  const line = (label, value, color, bold)=> el('div', {
    style:{display:'flex', justifyContent:'space-between', gap:'10px', padding:'6px 0', fontSize:'14.5px', fontWeight: bold ? '700' : '500', color: color || 'var(--ink)'}
  }, [ el('span', {text:label}), el('span', {text:value}) ]);

  card.appendChild(line('Ödenecek tutar (henüz bildirmediğiniz)', formatPrice(unpaidTotal), unpaidTotal > 0 ? 'var(--danger)' : 'var(--muted)', true));
  card.appendChild(line('Kantinci onayı bekleyen', formatPrice(pendingTotal), 'var(--muted)'));
  card.appendChild(line('Onaylanan (ödenmiş)', formatPrice(confirmedTotal), 'var(--success)'));

  if(unpaid.length > 0){
    card.appendChild(el('div', {text:'Ödemesi bekleyen günler', style:{fontWeight:'700', fontSize:'13.5px', margin:'14px 0 6px 0', paddingTop:'12px', borderTop:'1px solid var(--card-line)'}}));
    unpaid.forEach(x=>{
      card.appendChild(el('div', {style:{padding:'7px 10px', background:'var(--cream)', borderRadius:'9px', marginBottom:'6px'}}, [
        el('div', {style:{display:'flex', justifyContent:'space-between', gap:'10px', fontSize:'14px', fontWeight:'600'}}, [
          el('span', {text: formatDateTR(x.day.date)}),
          el('span', {text: formatPrice(x.total)})
        ]),
        el('div', {text: x.names + (x.rejected ? '  ·  ⚠ Ödeme onaylanmadı' : ''), style:{fontSize:'12.5px', color: x.rejected ? 'var(--danger)' : 'var(--muted)', marginTop:'2px'}})
      ]));
    });

    const bulkBtn = el('button', {class:'btn btn-gold', text:'Tüm borcumu ödedim olarak bildir (' + formatPrice(unpaidTotal) + ')', style:{marginTop:'10px'}});
    bulkBtn.addEventListener('click', async ()=>{
      if(!confirm(unpaid.length + ' gün için toplam ' + formatPrice(unpaidTotal) + ' ödemeyi yaptığınızı bildirmek istiyor musunuz? Kantinci onayladığında ödenmiş sayılacak.')) return;
      const fresh = await getSelections();
      menu.forEach(day=>{
        const cur = normalizeSelection(fresh[day.id] && fresh[day.id][teacherId]);
        if(cur && cur.optionIds.length > 0 && !cur.paidByTeacher && !cur.paidConfirmed){
          cur.paidByTeacher = true;
          cur.paymentRejected = false;
          fresh[day.id][teacherId] = cur;
        }
      });
      await setSelections(fresh);
      render();
    });
    card.appendChild(bulkBtn);
    card.appendChild(el('div', {class:'hint', text:'Haftalık toplu ödeme yaptıysanız bu butonla tüm günleri tek seferde bildirebilirsiniz. Günleri tek tek bildirmek isterseniz aşağıdaki günlük kartlardaki "Ödeme yaptım" butonunu kullanın.', style:{display:'block'}}));
  } else if(pending.length === 0 && confirmedTotal === 0){
    card.appendChild(el('div', {class:'hint', text:'Henüz seçtiğiniz bir gün yok.', style:{display:'block', marginTop:'8px'}}));
  } else if(unpaid.length === 0){
    card.appendChild(el('div', {class:'hint', text:'Bildirilmemiş borcunuz yok. 👍', style:{display:'block', marginTop:'8px'}}));
  }
  return card;
}
/* ---------- VIEW: teacher panel ---------- */
async function viewTeacherPanel(){
  const c = el('div');
  const teacherId = state.session.teacherId;
  const menu = await getMenu();
  const selectionsRaw = await getSelections();
  const cfg = await getConfig();
  const today = todayStr();

  // Ödeme reddedilen günler için bildirim topla
  const rejectedDays = [];
  menu.forEach(day=>{
    const raw = selectionsRaw[day.id] && selectionsRaw[day.id][teacherId];
    const sel = normalizeSelection(raw, day.options && day.options[0] && day.options[0].id);
    if(sel && sel.paymentRejected) rejectedDays.push(day);
  });
 c.appendChild(buildPaymentSummary(menu, selectionsRaw, teacherId));
  c.appendChild(el('h2', {text:'Haftalık menü', style:{fontSize:'21px', marginBottom:'4px'}}));
  c.appendChild(el('p', {text:'Katılmak istediğiniz günleri ve seçeneği işaretleyin.', style:{color:'var(--muted)', fontSize:'14px', display:'block', marginBottom:'18px'}}));

  if(rejectedDays.length > 0){
    const box = el('div', {class:'msg error'});
    box.appendChild(el('div', {text:'⚠ Ödeme onaylanmadı', style:{fontWeight:'700', marginBottom:'4px'}}));
    rejectedDays.forEach(day=>{
      box.appendChild(el('div', {text: formatDateTR(day.date) + ' tarihli siparişiniz için ödemeniz onaylanmadı. Lütfen kantinciyle görüşün.'}));
    });
    c.appendChild(box);
  }

  if(!cfg.ordersOpen){
    c.appendChild(el('div', {class:'msg error', text:'Kantinci şu anda yeni sipariş almıyor. Sipariş alımı tekrar açıldığında seçim yapabilirsiniz.'}));
  }

  if(menu.length === 0){
    c.appendChild(el('div', {class:'empty-note', text:'Bu hafta için menü henüz girilmedi.'}));
    return c;
  }

  const upcoming = menu.filter(d=> d.date >= today);
  const past = menu.filter(d=> d.date < today);

  if(upcoming.length === 0){
    c.appendChild(el('div', {class:'empty-note', text:'Yaklaşan menü bulunmuyor.'}));
  }

  upcoming.forEach(day=>{
    const raw = selectionsRaw[day.id] && selectionsRaw[day.id][teacherId];
    const sel = normalizeSelection(raw, day.options && day.options[0] && day.options[0].id);
    const isSelected = !!(sel && sel.optionIds && sel.optionIds.length > 0);
    const card = el('div', {class:'day-card'});
    card.appendChild(el('div', {class:'dc-top'}, [
      el('div', {class:'dc-date', text: formatDateTR(day.date)})
    ]));
    card.appendChild(el('div', {class:'hint', text:'Birden fazla seçenek işaretleyebilirsiniz.', style:{display:'block', marginBottom:'8px'}}));

    const optWrap = el('div', {style:{display:'flex', flexDirection:'column', gap:'8px', marginBottom:'12px'}});
    (day.options||[]).forEach(opt=>{
      const active = !!(sel && sel.optionIds && sel.optionIds.includes(opt.id));
      const optBtn = el('button', {
        class:'toggle-btn' + (active ? ' active' : ''),
        style:{display:'flex', justifyContent:'space-between', textAlign:'left'},
        attrs: (!cfg.ordersOpen ? {disabled:'disabled'} : {})
      }, [
        el('span', {text: (active ? '✓ ' : '') + opt.name}),
        el('span', {text: formatPrice(opt.price)})
      ]);
      optBtn.addEventListener('click', async ()=>{
        if(!cfg.ordersOpen) return;
        const fresh = await getSelections();
        if(!fresh[day.id]) fresh[day.id] = {};
        const curRaw = fresh[day.id][teacherId];
        const cur = normalizeSelection(curRaw) || { optionIds:[], paidByTeacher:false, paidConfirmed:false, paymentRejected:false };
        const idx = cur.optionIds.indexOf(opt.id);
        if(idx > -1) cur.optionIds.splice(idx, 1);
        else cur.optionIds.push(opt.id);
        if(cur.optionIds.length === 0){
          delete fresh[day.id][teacherId];
        } else {
          fresh[day.id][teacherId] = cur;
        }
        await setSelections(fresh);
        render();
      });
      optWrap.appendChild(optBtn);
    });
    card.appendChild(optWrap);

    if(isSelected){
      const total = sel.optionIds.reduce((sum, id)=>{
        const opt = (day.options||[]).find(o=>o.id===id);
        return sum + (opt ? Number(opt.price)||0 : 0);
      }, 0);
      card.appendChild(el('div', {text:'Toplam: ' + formatPrice(total), style:{fontWeight:'700', color:'var(--gold-dark)', fontSize:'14.5px', marginBottom:'10px'}}));

      const payWrap = el('div', {style:{display:'flex', alignItems:'center', gap:'10px', paddingTop:'8px', borderTop:'1px solid var(--card-line)'}});
      const payBtn = el('button', {
        class:'btn btn-sm ' + (sel.paidByTeacher ? 'btn-dark' : 'btn-outline'),
        text: sel.paidByTeacher ? '✓ Ödeme bildirildi' : 'Ödeme yaptım',
        style:{width:'auto'}
      });
      payBtn.addEventListener('click', async ()=>{
        const fresh = await getSelections();
        const cur = normalizeSelection(fresh[day.id] && fresh[day.id][teacherId]);
        if(!cur) return;
        cur.paidByTeacher = !cur.paidByTeacher;
        cur.paymentRejected = false;
        if(!cur.paidByTeacher) cur.paidConfirmed = false;
        fresh[day.id][teacherId] = cur;
        await setSelections(fresh);
        render();
      });
      payWrap.appendChild(payBtn);
      if(sel.paidConfirmed){
        payWrap.appendChild(el('span', {text:'✓ Kantinci onayladı', style:{fontSize:'12.5px', color:'var(--success)', fontWeight:'600'}}));
      } else if(sel.paidByTeacher){
        payWrap.appendChild(el('span', {text:'Onay bekleniyor', style:{fontSize:'12.5px', color:'var(--muted)'}}));
      }
      card.appendChild(payWrap);
    }

    c.appendChild(card);
  });

  if(past.length > 0){
    c.appendChild(el('div', {class:'section-title'}, [ el('h2', {text:'Geçmiş günler'}) ]));
    past.slice().reverse().forEach(day=>{
      const raw = selectionsRaw[day.id] && selectionsRaw[day.id][teacherId];
      const sel = normalizeSelection(raw, day.options && day.options[0] && day.options[0].id);
      const optNames = sel && sel.optionIds && sel.optionIds.length > 0
        ? sel.optionIds.map(id => ((day.options||[]).find(o=>o.id===id)||{}).name).filter(Boolean).join(', ')
        : null;
      const card = el('div', {class:'day-card', style:{opacity:'0.75'}});
      card.appendChild(el('div', {class:'dc-top'}, [ el('div', {class:'dc-date', text: formatDateTR(day.date)}) ]));
      card.appendChild(el('div', {class:'dc-items', text: optNames ? ('Seçiminiz: ' + optNames) : 'Bu gün için seçim yapmadınız.'}));
      c.appendChild(card);
    });
  }

  return c;
}

// Bir günün sipariş satırını (öğretmen listesi + ürün toplamları + ödeme onayı) oluşturur
function appendOrderRow(c, day, selections, teacherMap){
  const daySelRaw = selections[day.id] || {};
  const entries = Object.keys(daySelRaw)
    .map(tid => ({ tid, sel: normalizeSelection(daySelRaw[tid], day.options && day.options[0] && day.options[0].id) }))
    .filter(x => x.sel && x.sel.optionIds && x.sel.optionIds.length > 0);

  const row = el('div', {class:'selection-row', on:{click:()=>{ state.expanded[day.id] = !state.expanded[day.id]; render(); }}}, [
    el('div', {text: formatDateTR(day.date)}),
    el('div', {class:'count', text: entries.length + ' öğretmen'})
  ]);
  c.appendChild(row);

  if(!state.expanded[day.id]) return;

  const detail = el('div', {class:'selection-names', style:{display:'flex', flexDirection:'column', gap:'8px', padding:'10px 4px 4px 4px'}});

  if(entries.length === 0){
    detail.appendChild(el('div', {text:'Henüz seçim yapılmadı.', style:{color:'var(--muted)'}}));
  } else {
    entries.forEach(({tid, sel})=>{
      const optNames = sel.optionIds
        .map(id => ((day.options||[]).find(o=>o.id===id)||{}).name)
        .filter(Boolean)
        .join(', ');
      const line = el('div', {style:{display:'flex', alignItems:'center', justifyContent:'space-between', gap:'8px', flexWrap:'wrap', padding:'8px 10px', background:'var(--cream)', borderRadius:'9px'}});
      line.appendChild(el('div', {}, [
        el('div', {text: teacherMap[tid] || 'Bilinmeyen öğretmen', style:{fontWeight:'600', fontSize:'14px'}}),
        el('div', {text: optNames || 'Seçenek silinmiş', style:{fontSize:'12.5px', color:'var(--muted)'}})
      ]));
      const payWrap = el('div', {style:{display:'flex', alignItems:'center', gap:'6px'}});
      if(sel.paidConfirmed){
        payWrap.appendChild(el('span', {text:'✓ Ödendi', style:{fontSize:'12.5px', color:'var(--success)', fontWeight:'700'}}));
        payWrap.appendChild(el('button', {class:'btn btn-outline btn-sm', text:'Geri al', on:{click: async ()=>{
          const fresh = await getSelections();
          const cur = normalizeSelection(fresh[day.id] && fresh[day.id][tid]);
          if(!cur) return;
          cur.paidConfirmed = false;
          fresh[day.id][tid] = cur;
          await setSelections(fresh);
          render();
        }}}));
      } else if(sel.paidByTeacher){
        payWrap.appendChild(el('span', {text:'Ödeme bildirildi', style:{fontSize:'12.5px', color:'var(--muted)'}}));
        payWrap.appendChild(el('button', {class:'btn btn-gold btn-sm', text:'Onayla', on:{click: async ()=>{
          const fresh = await getSelections();
          const cur = normalizeSelection(fresh[day.id] && fresh[day.id][tid]);
          if(!cur) return;
          cur.paidConfirmed = true;
          cur.paymentRejected = false;
          fresh[day.id][tid] = cur;
          await setSelections(fresh);
          render();
        }}}));
        payWrap.appendChild(el('button', {class:'btn btn-danger btn-sm', text:'Reddet', on:{click: async ()=>{
          const fresh = await getSelections();
          const cur = normalizeSelection(fresh[day.id] && fresh[day.id][tid]);
          if(!cur) return;
          cur.paidByTeacher = false;
          cur.paidConfirmed = false;
          cur.paymentRejected = true;
          fresh[day.id][tid] = cur;
          await setSelections(fresh);
          render();
        }}}));
      } else {
        payWrap.appendChild(el('span', {text:'Ödeme bekleniyor', style:{fontSize:'12.5px', color:'var(--danger)'}}));
      }
      line.appendChild(payWrap);
      detail.appendChild(line);
    });
  }

  // --- Ürün bazında toplamlar ---
  if(entries.length > 0){
    const totals = {};
    entries.forEach(({sel})=>{
      sel.optionIds.forEach(id=>{
        totals[id] = (totals[id]||0) + 1;
      });
    });
    const totalsBox = el('div', {style:{marginTop:'4px', paddingTop:'10px', borderTop:'1px dashed var(--card-line)'}});
    totalsBox.appendChild(el('div', {text:'Ürün bazında toplam', style:{fontWeight:'700', fontSize:'13.5px', marginBottom:'6px'}}));
    (day.options||[]).forEach(opt=>{
      const count = totals[opt.id] || 0;
      if(count === 0) return;
      totalsBox.appendChild(el('div', {
        text: `${opt.name}: ${count} adet`,
        style:{fontSize:'13.5px', color:'var(--ink)', padding:'2px 0'}
      }));
    });
    detail.appendChild(totalsBox);
  }

  c.appendChild(detail);
}

/* ---------- modal: edit day ---------- */
async function buildEditDayModal(dayId){
  const overlay = el('div', {class:'modal-overlay', on:{click:(e)=>{ if(e.target===overlay){ state.modal=null; render(); } }}});
  const box = el('div', {class:'modal-box'});
  const menu = await getMenu();
  const existing = dayId ? menu.find(d=>d.id===dayId) : null;

  box.appendChild(el('h3', {text: existing ? 'Günü düzenle' : 'Yeni gün ekle'}));

  const dateField = el('div', {class:'field'});
  dateField.appendChild(el('label', {text:'Tarih'}));
  const dateInput = el('input', {attrs:{type:'date', value: existing ? existing.date : ''}});
  dateField.appendChild(dateInput);
  box.appendChild(dateField);

  // --- Çoklu menü seçenekleri ---
  const optsLabel = el('label', {text:'Menü seçenekleri', style:{display:'block', fontSize:'13.5px', fontWeight:'600', marginBottom:'6px'}});
  box.appendChild(optsLabel);
  box.appendChild(el('div', {class:'hint', text:'Örn: "Çorba" 60₺, "Ana Yemek" 120₺, "Tam Menü" 185₺ gibi ayrı seçenekler ekleyin.', style:{marginBottom:'10px', display:'block'}}));

  const optsWrap = el('div', {style:{display:'flex', flexDirection:'column', gap:'8px', marginBottom:'10px'}});
  box.appendChild(optsWrap);

  // Başlangıç seçenekleri: var olan gün varsa onun options'ı, yoksa tek boş satır
  const rows = [];
  const initialOptions = (existing && existing.options && existing.options.length > 0)
    ? existing.options
    : [{ id: uid(), name:'', price:'' }];

  function addRow(opt){
    const rowWrap = el('div', {class:'row', style:{alignItems:'flex-start'}});
    const nameInput = el('input', {attrs:{type:'text', placeholder:'Seçenek adı (Örn: Tam Menü)'}});
    nameInput.value = opt.name || '';
    const priceInput = el('input', {attrs:{type:'number', min:'0', step:'0.5', placeholder:'Fiyat'}, style:{maxWidth:'110px', flex:'0 0 110px'}});
    priceInput.value = (opt.price !== undefined && opt.price !== '') ? opt.price : '';
    const removeBtn = el('button', {class:'btn btn-danger btn-sm', text:'✕', style:{width:'auto', flex:'0 0 auto'}});
    removeBtn.addEventListener('click', ()=>{
      const idx = rows.findIndex(r=>r.wrap === rowWrap);
      if(idx>-1) rows.splice(idx,1);
      rowWrap.remove();
    });
    const inner = el('div', {style:{display:'flex', gap:'8px', width:'100%'}}, [nameInput, priceInput, removeBtn]);
    rowWrap.appendChild(inner);
    optsWrap.appendChild(rowWrap);
    rows.push({ wrap: rowWrap, nameInput, priceInput, id: opt.id || uid() });
  }
  initialOptions.forEach(addRow);

  const addOptBtn = el('button', {class:'btn btn-outline btn-sm', text:'+ Seçenek ekle', style:{width:'auto', marginBottom:'16px'}});
  addOptBtn.addEventListener('click', ()=> addRow({ name:'', price:'' }));
  box.appendChild(addOptBtn);

  const errBox = el('div');
  box.appendChild(errBox);

  const row = el('div', {class:'row', style:{marginTop:'6px'}});
  const cancelBtn = el('button', {class:'btn btn-outline', text:'İptal', on:{click:()=>{ state.modal=null; render(); }}});
  const saveBtn = el('button', {class:'btn btn-gold', text:'Kaydet'});
  row.appendChild(cancelBtn); row.appendChild(saveBtn);
  box.appendChild(row);

  saveBtn.addEventListener('click', async ()=>{
    errBox.innerHTML = '';
    if(!dateInput.value){ errBox.appendChild(el('div',{class:'msg error', text:'Tarih seçin.'})); return; }
    const filledRows = rows.filter(r => r.nameInput.value.trim());
    if(filledRows.length === 0){ errBox.appendChild(el('div',{class:'msg error', text:'En az bir menü seçeneği girin.'})); return; }
    const invalidPrice = filledRows.some(r => r.priceInput.value === '' || isNaN(Number(r.priceInput.value)) || Number(r.priceInput.value) < 0);
    if(invalidPrice){ errBox.appendChild(el('div',{class:'msg error', text:'Her seçenek için geçerli bir fiyat girin.'})); return; }
    const options = filledRows.map(r => ({ id: r.id, name: r.nameInput.value.trim(), price: Number(r.priceInput.value) }));
    const fresh = await getMenu();
    if(existing){
      const idx = fresh.findIndex(d=>d.id===existing.id);
      fresh[idx] = { ...fresh[idx], date: dateInput.value, options };
    } else {
      fresh.push({ id: uid(), date: dateInput.value, options });
    }
    await setMenu(fresh);
    state.modal = null;
    render();
  });

  overlay.appendChild(box);
  return overlay;
}

/* ---------- master render ---------- */
async function render(resetScroll){
  const savedScrollY = window.scrollY;
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(buildTopbar());
  if(state.drawerOpen) app.appendChild(buildDrawer());

  const page = el('div', {class:'page'});
  app.appendChild(page);

  if(state.history.length > 0){
    page.appendChild(el('button', {class:'back-link', text:'‹ Geri', on:{click: goBack}}));
  }

  let content;
  switch(state.view){
    case 'home': content = viewHome(); break;
    case 'teacherPick': content = await viewTeacherPick(); break;
    case 'teacherLogin': content = await viewTeacherLogin(); break;
    case 'teacherForgot': content = await viewTeacherForgot(); break;
    case 'teacherPanel': content = await viewTeacherPanel(); break;
    case 'teacherChangePass': content = await viewTeacherChangePass(); break;
    case 'canteenLogin': content = await viewCanteenLogin(); break;
    case 'canteenForgot': content = await viewCanteenForgot(); break;
    case 'canteenSettings': content = await viewCanteenSettings(); break;
    case 'canteenPanel': page.classList.add('wide'); content = await viewCanteenPanel(); break;
    case 'adminLogin': content = await viewAdminLogin(); break;
    case 'adminPanel': page.classList.add('wide'); content = await viewAdminPanel(); break;
    default: content = viewHome();
  }
  page.appendChild(content);

  if(state.modal && state.modal.type === 'editDay'){
    const modal = await buildEditDayModal(state.modal.dayId);
    app.appendChild(modal);
  }

  if(resetScroll){ window.scrollTo(0,0); }
  else { window.scrollTo(0, savedScrollY); }
}

replaceNav();
render();
</script>
</body>
</html>
